name: Release

on:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/codex-bridge
            output: codex-bridge-linux-amd64
            rustflags: ""
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/codex-bridge
            output: codex-bridge-linux-arm64
            rustflags: ""
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/codex-bridge.exe
            output: codex-bridge-windows-amd64.exe
            rustflags: -C target-feature=+crt-static
          - name: mac-arm64
            os: macos-14
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/codex-bridge
            output: codex-bridge-mac-arm64
            rustflags: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Install Linux musl toolchain
        if: startsWith(matrix.name, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static release
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}" --bin codex-bridge
          cp "${{ matrix.binary }}" "${{ matrix.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Generate release tag
        id: tag
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          sudo date -s "$(wget -qSO- --max-redirect=0 google.com 2>&1 | grep Date: | cut -d' ' -f5-8)Z"
          echo "release_tag=Release_$(date +"%Y.%m.%d_%H-%M-%S")" >> $GITHUB_OUTPUT
          echo "release_hash=$(git log --format="%H" -n 1)" >> $GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.tag.outputs.release_hash }}
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: |
            ./codex-bridge-*
