name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux test and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Live Podman process-lifecycle regression
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          socket="$RUNNER_TEMP/codexbridge-podman.sock"
          sudo -n podman system service --time=0 "unix://$socket" >"$RUNNER_TEMP/podman-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if sudo -n env CONTAINER_HOST="unix://$socket" podman info >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/podman-service.log"
            exit 1
          fi
          CODEXBRIDGE_PODMAN_TIMEOUT_PROBE=1 \
          CODEXBRIDGE_PODMAN_ROOTFUL_PROBE=1 \
          CODEXBRIDGE_PODMAN_TIMEOUT_SOCKET="$socket" \
          cargo test --all-features --lib \
            tools::process::tests::regression_podman_timeout_and_cancel_remove_daemon_managed_containers \
            -- --ignored --exact --nocapture
          leftovers="$(sudo -n env CONTAINER_HOST="unix://$socket" podman ps -aq --filter name=tmp-codexbridge-)"
          if [ -n "$leftovers" ]; then
            echo "live Podman regression left test containers behind: $leftovers" >&2
            sudo -n env CONTAINER_HOST="unix://$socket" podman ps -a --filter name=tmp-codexbridge-
            exit 1
          fi
      - name: Build bins and examples
        run: cargo build --bins --examples
      - name: Validate smoke script
        run: bash -n scripts/mcp_smoke.sh
      - name: Validate diff whitespace
        run: git diff --check
      - name: MCP smoke test
        run: scripts/mcp_smoke.sh

  platform:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.os }}
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Windows PowerShell diagnostics
        if: matrix.os == 'windows-latest'
        shell: pwsh
        continue-on-error: true
        env:
          CODEXBRIDGE_WINDOWS_PROCESS_DIAGNOSTICS: '1'
          RUST_BACKTRACE: '1'
        run: |
          Write-Host '=== Windows / PowerShell environment ==='
          [System.Environment]::OSVersion | Format-List | Out-String | Write-Host
          $PSVersionTable | Format-List | Out-String | Write-Host
          Get-Command powershell.exe | Format-List Name,Source,Version | Out-String | Write-Host
          Get-Command pwsh.exe -ErrorAction SilentlyContinue | Format-List Name,Source,Version | Out-String | Write-Host
          foreach ($name in @(
            'PATH','PATHEXT','SystemRoot','WINDIR','ComSpec','USERPROFILE',
            'HOMEDRIVE','HOMEPATH','LOCALAPPDATA','APPDATA','ProgramData',
            'ProgramFiles','ProgramFiles(x86)','ProgramW6432','SystemDrive',
            'TEMP','TMP','PSModulePath'
          )) {
            Write-Host ("{0}={1}" -f $name, [Environment]::GetEnvironmentVariable($name))
          }

          Write-Host '=== Direct Windows PowerShell smoke ==='
          $script = "Write-Output 'codexbridge-direct-stdout'; [Console]::Error.WriteLine('codexbridge-direct-stderr'); exit 0"
          $bytes = [Text.Encoding]::Unicode.GetBytes($script)
          $encoded = [Convert]::ToBase64String($bytes)
          $directWatch = [Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoLogo -NoProfile -NonInteractive -EncodedCommand $encoded
          $directWatch.Stop()
          Write-Host "direct-powershell-exit=$LASTEXITCODE elapsed_ms=$($directWatch.ElapsedMilliseconds)"

          Write-Host '=== Isolated LOCALAPPDATA Windows PowerShell smoke ==='
          $originalLocalAppData = $env:LOCALAPPDATA
          $isolatedLocalAppData = Join-Path $env:TEMP ("codexbridge-powershell-diag-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $isolatedLocalAppData -Force | Out-Null
          try {
            $env:CODEXBRIDGE_DIAG_RESTORE_LOCALAPPDATA = $originalLocalAppData
            $env:LOCALAPPDATA = $isolatedLocalAppData
            $isolatedScript = "[Environment]::SetEnvironmentVariable('LOCALAPPDATA', `$env:CODEXBRIDGE_DIAG_RESTORE_LOCALAPPDATA, 'Process'); Write-Output 'codexbridge-isolated-cache-stdout'; [Console]::Error.WriteLine('codexbridge-isolated-cache-stderr'); exit 0"
            $isolatedBytes = [Text.Encoding]::Unicode.GetBytes($isolatedScript)
            $isolatedEncoded = [Convert]::ToBase64String($isolatedBytes)
            $isolatedWatch = [Diagnostics.Stopwatch]::StartNew()
            & powershell.exe -NoLogo -NoProfile -NonInteractive -EncodedCommand $isolatedEncoded
            $isolatedWatch.Stop()
            Write-Host "direct-isolated-powershell-exit=$LASTEXITCODE elapsed_ms=$($isolatedWatch.ElapsedMilliseconds)"
            Get-ChildItem -Path $isolatedLocalAppData -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Write-Host
          } finally {
            $env:LOCALAPPDATA = $originalLocalAppData
            Remove-Item Env:CODEXBRIDGE_DIAG_RESTORE_LOCALAPPDATA -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $isolatedLocalAppData -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host '=== Isolated CodexBridge regressions ==='
          $tests = @(
            'sandbox::tests::exec_env_additions_reject_malformed_keys_and_oversized_values',
            'tools::process::tests::windows_default_powershell_preserves_powershell_command_failure',
            'tools::process::tests::windows_default_powershell_propagates_native_exit_code_end_to_end',
            'tools::process::tests::windows_default_powershell_uses_final_success_after_native_failure',
            'tools::process::tests::windows_non_tty_exec_default_powershell_keeps_stdout_and_stderr_pipes'
          )
          foreach ($test in $tests) {
            Write-Host "--- $test ---"
            cargo test --all-features $test -- --exact --nocapture --test-threads=1
            Write-Host "isolated-test-exit=$LASTEXITCODE"
          }
      - name: Test
        run: cargo test --all-features
      - name: Build bins and examples
        run: cargo build --bins --examples
