[package]
name = "codex-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Production MCP coding-agent bridge with Codex-style tools and isolated conversation workspaces."
readme = "README.md"

[lib]
name = "codex_bridge"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
diffy = "0.4"
futures-util = "0.3"
libc = "0.2"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
rmcp = { version = "3.1.4", features = ["client", "server", "macros", "schemars", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
vt100 = "0.15"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
# rustc/lld 1.98 can emit hidden-symbol relocation failures for large
# multi-CGU test graphs. A single CGU is deterministic across supported
# linkers and keeps `cargo check` / `cargo test` usable without local flags.
codegen-units = 1
incremental = false

[profile.test]
codegen-units = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
